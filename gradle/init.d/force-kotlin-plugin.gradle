// Force Kotlin Gradle plugin and stdlib versions to 2.3.0 across the build
initscript {
  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
  }
}

settingsEvaluated { settings ->
  try {
    settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
      def idStr = null
      try { idStr = details.requested.id.id } catch (e) { idStr = details.requested.toString() }
      if (idStr != null && idStr.startsWith('org.jetbrains.kotlin')) {
        details.useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')
      }
    }
  } catch (ignored) {
  }
}

gradle.rootProject { root ->
  root.allprojects { p ->
    p.configurations.matching { true }.all { cfg ->
      try {
        cfg.resolutionStrategy.eachDependency { details ->
          if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '2.3.0'
          }
        }
      } catch (ignored) {
      }
    }
  }
}
// Gradle init script to force a specific Kotlin Gradle plugin module/version
// This runs early for all included builds and should help enforce the plugin
// coordinate even when included builds declare their own plugin classpaths.

settingsEvaluated { settings ->
  try {
    settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
      def requestedStr = null
      try {
        requestedStr = details.requested.id.id
      } catch (ignored) {
        requestedStr = details.requested.toString()
      }
      if (requestedStr != null && requestedStr.startsWith('org.jetbrains.kotlin')) {
        details.useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')
      }
    }
  } catch (ignored) {
    // If pluginManagement or resolutionStrategy isn't available here, ignore.
  }
}
