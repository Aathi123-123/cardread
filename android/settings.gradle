pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
  // Ensure Kotlin Gradle plugin version matches Gradle's bundled Kotlin libraries
  resolutionStrategy {
    eachPlugin { details ->
      def requestedStr = null
      try {
        requestedStr = details.requested.id.id
      } catch (ignored) {
        try {
          requestedStr = details.requested.id
        } catch (ignored2) {
          requestedStr = details.requested.toString()
        }
      }

      // Force the Kotlin Gradle plugin to a specific version and map to its module
      if (requestedStr != null && (requestedStr == 'org.jetbrains.kotlin.jvm' || requestedStr.startsWith('org.jetbrains.kotlin'))) {
        useVersion('2.3.0')
        // Ensure the plugin resolution uses the exact artifact coordinate
        useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')
      }

      // Additional defensive mapping for other possible request shapes
      try {
        if (details.requested.group == 'org.jetbrains.kotlin') {
          useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0')
        }
      } catch (ignored3) {
        // ignore
      }
    }
  }
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'AI Smart Card Organizer'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
